<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PullUP!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            accent: '#10b981'
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        button {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased pb-8">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-20 bg-darkbg/90 backdrop-blur-md border-b border-darkborder px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-green-500/20">
                <i class="fa-solid font-black">U P</i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-none tracking-tight">Pull<span class="text-brand-500">UP!</span></h1>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <span id="user-email-display" class="text-xs text-slate-400 max-w-[120px] truncate hidden"></span>
            <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </header>

    <!-- Modal de Autenticação / Login -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-darkcard border border-darkborder rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <div class="text-center">
                <h2 class="text-xl font-bold text-white">Bem-vindo ao PullUP!</h2>
                <p class="text-xs text-slate-400 mt-1">Entre ou crie sua conta para acessar seus dados</p>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Senha</label>
                    <input type="password" id="auth-password" required minlength="6" placeholder="******" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500 text-sm">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-brand-600/30">
                    Entrar
                </button>
            </form>

            <div class="text-center pt-2 border-t border-darkborder">
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-xs text-brand-500 hover:underline">
                    Não tem conta? Cadastre-se
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 pt-4 space-y-6">

        <!-- Banner / Summary Today -->
        <section class="bg-gradient-to-br from-darkcard to-slate-900 border border-darkborder p-5 rounded-3xl shadow-xl relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="text-xs uppercase tracking-wider font-semibold text-brand-500 bg-brand-500/10 px-2.5 py-1 rounded-md border border-brand-500/20">
                        Hoje
                    </span>
                    <h2 id="today-date-str" class="text-slate-400 text-xs mt-2">--/--/----</h2>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400">Total Geral:</span>
                    <p id="total-all-time" class="text-sm font-semibold text-slate-200">0</p>
                </div>
            </div>
            
            <div class="flex items-baseline space-x-2 my-2">
                <span id="today-total-count" class="text-6xl font-black text-white tracking-tight">0</span>
                <span class="text-lg font-medium text-slate-400">reps</span>
            </div>

            <!-- Quick Add Buttons -->
            <div class="grid grid-cols-4 gap-2 mt-5">
                <button onclick="addQuickReps(1)" class="py-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 transition border border-slate-700 rounded-2xl font-bold text-brand-500 text-lg shadow-sm flex flex-col items-center">
                    <span>+1</span>
                </button>
                <button onclick="addQuickReps(5)" class="py-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 transition border border-slate-700 rounded-2xl font-bold text-brand-500 text-lg shadow-sm flex flex-col items-center">
                    <span>+5</span>
                </button>
                <button onclick="addQuickReps(10)" class="py-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 transition border border-slate-700 rounded-2xl font-bold text-brand-500 text-lg shadow-sm flex flex-col items-center">
                    <span>+10</span>
                </button>
                <button onclick="openCustomInputModal()" class="py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 transition text-white rounded-2xl font-bold text-lg shadow-lg shadow-brand-600/30 flex items-center justify-center">
                    <i class="fa-solid fa-pen-clip text-sm"></i>
                </button>
            </div>
        </section>

        <!-- Custom / Manual Entry Form -->
        <section class="bg-darkcard border border-darkborder rounded-2xl p-4 shadow-md">
            <button id="toggle-manual-form" class="w-full flex justify-between items-center text-sm font-medium text-slate-300">
                <span class="flex items-center gap-2"><i class="fa-regular fa-calendar-plus text-brand-500"></i> Registro Retroativo / Personalizado</span>
                <i id="manual-form-icon" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
            </button>
            
            <div id="manual-form-container" class="hidden mt-4 pt-4 border-t border-darkborder space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Quantidade de Repetições</label>
                    <input type="number" id="manual-count" min="1" max="500" value="10" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500 text-base">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Data e Hora</label>
                    <input type="datetime-local" id="manual-datetime" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-brand-500 text-sm">
                </div>
                <button onclick="submitManualRecord()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 rounded-xl transition active:scale-98 shadow-md">
                    Registrar Treino
                </button>
            </div>
        </section>

        <!-- Analytics & Chart Section -->
        <section class="bg-darkcard border border-darkborder rounded-3xl p-4 shadow-xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                <h3 class="font-bold text-slate-200 text-base flex items-center gap-2">
                    <i class="fa-solid fa-chart-column text-brand-500"></i> Progresso
                </h3>
                <div class="inline-flex bg-darkbg p-1 rounded-xl border border-darkborder text-xs w-full sm:w-auto">
                    <button id="filter-days-btn" onclick="setChartFilter('days')" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-white bg-slate-700 transition">
                        Por Dia
                    </button>
                    <button id="filter-hours-btn" onclick="setChartFilter('hours')" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-slate-400 transition">
                        Por Período
                    </button>
                </div>
            </div>

            <div class="relative w-full h-56">
                <canvas id="pullupChart"></canvas>
            </div>
            <p id="chart-subtext" class="text-center text-xs text-slate-500 mt-2">Mostrando progresso dos últimos dias</p>
        </section>

        <!-- History Log Section -->
        <section class="bg-darkcard border border-darkborder rounded-3xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center border-b border-darkborder pb-3">
                <h3 class="font-bold text-slate-200 text-base flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-brand-500"></i> Histórico Recente
                </h3>
                <span id="history-count-badge" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">0 registros</span>
            </div>

            <div id="history-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                <p class="text-center text-xs text-slate-500 py-6">Aguardando login...</p>
            </div>
        </section>

    </main>

    <!-- Custom Modal for Quick Input -->
    <div id="custom-input-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-darkcard border border-darkborder rounded-3xl p-6 w-full max-w-xs shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white text-center">Digite as Repetições</h3>
            <input type="number" id="quick-custom-count" min="1" max="1000" placeholder="Ex: 12" class="w-full bg-darkbg border border-darkborder rounded-2xl px-4 py-3 text-2xl font-bold text-center text-brand-500 focus:outline-none focus:border-brand-500">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeCustomInputModal()" class="py-2.5 bg-slate-800 text-slate-300 font-semibold rounded-xl border border-slate-700">Cancelar</button>
                <button onclick="submitCustomQuickReps()" class="py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- UI Message Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white border border-slate-700 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-brand-500"></i>
        <span id="toast-msg">Mensagem</span>
    </div>

    <script>
        const SUPABASE_URL = 'https://fbvearftixiqawzrfdlh.supabase.co';
        const SUPABASE_ANON_KEY = "sb_publishable_2duod4mJhCzIMr850bsaEA_mkfewUGr";

        let pullupRecords = [];
        let supabaseClient = null;
        let chartInstance = null;
        let currentChartFilter = 'days';
        let isSignUpMode = false;

        window.addEventListener('DOMContentLoaded', async () => {
            initDateInputs();
            initSupabaseClient();
            await checkUserSession();
            setupEventListeners();
        });

        function initDateInputs() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('manual-datetime').value = `${year}-${month}-${day}T${hours}:${minutes}`;
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            document.getElementById('today-date-str').textContent = now.toLocaleDateString('pt-BR', options);
        }

        function setupEventListeners() {
            document.getElementById('toggle-manual-form').addEventListener('click', () => {
                const container = document.getElementById('manual-form-container');
                const icon = document.getElementById('manual-form-icon');
                const isHidden = container.classList.contains('hidden');
                
                if (isHidden) {
                    container.classList.remove('hidden');
                    icon.classList.add('rotate-180');
                } else {
                    container.classList.add('hidden');
                    icon.classList.remove('rotate-180');
                }
            });
        }

        function initSupabaseClient() {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.error('Erro ao inicializar Supabase:', e);
            }
        }

        // GERENCIAMENTO DE SESSÃO / AUTENTICAÇÃO
        async function checkUserSession() {
            if (!supabaseClient) return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                onUserLoggedIn(session.user);
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-submit-btn').textContent = isSignUpMode ? 'Cadastrar' : 'Entrar';
            document.getElementById('toggle-auth-btn').textContent = isSignUpMode ? 'Já tem conta? Entrar' : 'Não tem conta? Cadastre-se';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (isSignUpMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    showToast('Conta criada com sucesso!', 'success');
                    if (data.user) onUserLoggedIn(data.user);
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showToast('Login realizado!', 'success');
                    if (data.user) onUserLoggedIn(data.user);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function onUserLoggedIn(user) {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('user-email-display').textContent = user.email;
            document.getElementById('user-email-display').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            fetchSupabaseData();
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            pullupRecords = [];
            document.getElementById('user-email-display').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('hidden');
            renderUI();
            showToast('Sessão encerrada', 'info');
        }

        // CARREGAR E MANIPULAR DADOS NUVEM
        async function fetchSupabaseData() {
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('pullups')
                    .select('*')
                    .order('timestamp', { ascending: false });

                if (error) throw error;

                if (data) {
                    pullupRecords = data.map(item => ({
                        id: item.id,
                        count: Number(item.count),
                        timestamp: new Date(item.timestamp).toISOString()
                    }));
                    renderUI();
                }
            } catch (err) {
                console.error('Erro ao buscar dados:', err);
                showToast('Erro ao carregar registros', 'error');
            }
        }

        async function addRecord(count, customIsoTimestamp = null) {
            const countNum = parseInt(count, 10);
            if (isNaN(countNum) || countNum <= 0) {
                showToast('Insira um número válido!', 'warning');
                return;
            }

            const timestampToSave = customIsoTimestamp || new Date().toISOString();

            try {
                showToast('Salvando...', 'info');
                const { data, error } = await supabaseClient
                    .from('pullups')
                    .insert([{ count: countNum, timestamp: timestampToSave }])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    const newRec = {
                        id: data[0].id,
                        count: Number(data[0].count),
                        timestamp: new Date(data[0].timestamp).toISOString()
                    };
                    pullupRecords.unshift(newRec);
                    renderUI();
                    showToast(`+${countNum} barras registradas!`, 'success');
                }
            } catch (e) {
                console.error('Erro ao salvar:', e);
                showToast('Erro ao salvar registro', 'error');
            }
        }

        function addQuickReps(amount) { addRecord(amount); }
        function openCustomInputModal() {
            document.getElementById('custom-input-modal').classList.remove('hidden');
            const input = document.getElementById('quick-custom-count');
            input.value = '';
            setTimeout(() => input.focus(), 100);
        }
        function closeCustomInputModal() { document.getElementById('custom-input-modal').classList.add('hidden'); }
        function submitCustomQuickReps() {
            const val = document.getElementById('quick-custom-count').value;
            if (val) { addRecord(val); closeCustomInputModal(); }
        }

        function submitManualRecord() {
            const count = document.getElementById('manual-count').value;
            const dateVal = document.getElementById('manual-datetime').value;
            if (!dateVal) { showToast('Selecione data/hora', 'warning'); return; }
            addRecord(count, new Date(dateVal).toISOString());
            document.getElementById('manual-form-container').classList.add('hidden');
            document.getElementById('manual-form-icon').classList.remove('rotate-180');
        }

        async function deleteRecord(id) {
            try {
                const { error } = await supabaseClient.from('pullups').delete().eq('id', id);
                if (error) throw error;

                pullupRecords = pullupRecords.filter(r => r.id !== id);
                renderUI();
                showToast('Registro removido', 'info');
            } catch (e) {
                showToast('Erro ao excluir registro', 'error');
            }
        }

        function renderUI() {
            renderTodayStats();
            renderHistoryList();
            renderChart();
        }

        function renderTodayStats() {
            const todayStr = new Date().toDateString();
            let todayTotal = 0;
            let allTimeTotal = 0;

            pullupRecords.forEach(rec => {
                const recDate = new Date(rec.timestamp);
                allTimeTotal += rec.count;
                if (recDate.toDateString() === todayStr) todayTotal += rec.count;
            });

            document.getElementById('today-total-count').textContent = todayTotal;
            document.getElementById('total-all-time').textContent = allTimeTotal;
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            const badge = document.getElementById('history-count-badge');
            badge.textContent = `${pullupRecords.length} registro${pullupRecords.length !== 1 ? 's' : ''}`;

            if (pullupRecords.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Nenhum registro encontrado.</p>`;
                return;
            }

            const sorted = [...pullupRecords].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            container.innerHTML = sorted.map(item => {
                const dateObj = new Date(item.timestamp);
                const dateFormatted = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                const timeFormatted = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="flex items-center justify-between bg-darkbg p-3 rounded-2xl border border-darkborder/60 hover:border-slate-700 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center font-black text-brand-500 text-sm">
                                +${item.count}
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-slate-200">${dateFormatted} às ${timeFormatted}</p>
                                <p class="text-[10px] text-slate-400">${getTimeAgo(dateObj)}</p>
                            </div>
                        </div>
                        <button onclick="deleteRecord(${item.id})" class="p-2 text-slate-500 hover:text-red-400 active:scale-90 transition" title="Excluir">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Agora mesmo';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `Há ${minutes} min`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `Há ${hours} h`;
            const days = Math.floor(hours / 24);
            return `Há ${days} dia(s)`;
        }

        function setChartFilter(filter) {
            currentChartFilter = filter;
            const btnDays = document.getElementById('filter-days-btn');
            const btnHours = document.getElementById('filter-hours-btn');

            if (filter === 'days') {
                btnDays.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-white bg-slate-700 transition';
                btnHours.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-slate-400 transition';
                document.getElementById('chart-subtext').textContent = 'Quantidade diária nos últimos 7 dias';
            } else {
                btnHours.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-white bg-slate-700 transition';
                btnDays.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-lg font-medium text-slate-400 transition';
                document.getElementById('chart-subtext').textContent = 'Acumulado por período do dia';
            }

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('pullupChart').getContext('2d');
            let labels = [];
            let chartData = [];

            if (currentChartFilter === 'days') {
                const daysMap = {};
                const now = new Date();

                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(now.getDate() - i);
                    const key = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                    daysMap[key] = 0;
                }

                pullupRecords.forEach(rec => {
                    const recDate = new Date(rec.timestamp);
                    const key = recDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                    if (daysMap.hasOwnProperty(key)) {
                        daysMap[key] += rec.count;
                    }
                });

                labels = Object.keys(daysMap);
                chartData = Object.values(daysMap);
            } else {
                const periods = {
                    'Madrugada (00h-06h)': 0,
                    'Manhã (06h-12h)': 0,
                    'Tarde (12h-18h)': 0,
                    'Noite (18h-24h)': 0
                };

                pullupRecords.forEach(rec => {
                    const hour = new Date(rec.timestamp).getHours();
                    if (hour >= 0 && hour < 6) periods['Madrugada (00h-06h)'] += rec.count;
                    else if (hour >= 6 && hour < 12) periods['Manhã (06h-12h)'] += rec.count;
                    else if (hour >= 12 && hour < 18) periods['Tarde (12h-18h)'] += rec.count;
                    else periods['Noite (18h-24h)'] += rec.count;
                });

                labels = ['Madrugada', 'Manhã', 'Tarde', 'Noite'];
                chartData = [
                    periods['Madrugada (00h-06h)'],
                    periods['Manhã (06h-12h)'],
                    periods['Tarde (12h-18h)'],
                    periods['Noite (18h-24h)']
                ];
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Barras Repetições',
                        data: chartData,
                        backgroundColor: '#22c55e',
                        hoverBackgroundColor: '#16a34a',
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f8fafc',
                            bodyColor: '#22c55e',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: (context) => `${context.parsed.y} repetições`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { color: '#94a3b8', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: '#334155', drawBorder: false },
                            ticks: { color: '#94a3b8', font: { size: 11 }, precision: 0 },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
